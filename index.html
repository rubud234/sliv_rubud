<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Продолжить</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#fff; height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:sans-serif; overflow:hidden;
  }
  #btn {
    padding:18px 60px; font-size:22px; font-weight:600; color:#fff;
    background:#1a1a1a; border:2px solid #444; border-radius:12px;
    cursor:pointer; letter-spacing:1px; transition:.2s;
  }
  #btn:hover { background:#2a2a2a; border-color:#666; transform:scale(1.05); }

  #scare {
    position:fixed; inset:0; z-index:9999; display:none; background:#000;
  }
  #scare img { width:100%; height:100%; object-fit:cover; }
  #scare.show { display:block; animation:shake .08s infinite, flash .15s infinite; }

  @keyframes shake {
    0%{transform:translate(0,0)} 25%{transform:translate(-14px,9px) rotate(-1.5deg)}
    50%{transform:translate(14px,-9px) rotate(1.5deg)}
    75%{transform:translate(-9px,-14px) rotate(-1deg)}
    100%{transform:translate(9px,14px) rotate(1deg)}
  }
  @keyframes flash {
    0%,100%{filter:brightness(1) contrast(1.2)}
    50%{filter:brightness(2) contrast(1.6) saturate(2)}
  }
</style>
</head>
<body>

<button id="btn">ПРОДОЛЖИТЬ</button>

<div id="scare">
  <img id="scareImg" alt="">
</div>

<!-- Звук 1: Громкий мужской крик (Orange Free Sounds, 2 сек) -->
<audio id="sound1" preload="auto"></audio>
<!-- Звук 2: Женский крик (Orange Free Sounds, 4 сек) -->
<audio id="sound2" preload="auto"></audio>

<script>
// --- РАБОЧИЕ ССЫЛКИ НА ЗВУКИ (Orange Free Sounds) ---
// 1. Громкий короткий мужской крик (Loud Male Scream) — прямая ссылка на MP3
const SOUND_1 = "https://orangefreesounds.com/wp-content/uploads/2026/10/Loud-Male-Scream-Sound-Effect.mp3";
// 2. Женский крик (Girl Screaming) — прямая ссылка на MP3
const SOUND_2 = "https://orangefreesounds.com/wp-content/uploads/2026/08/Girl-Screaming-Sound-Effect.mp3";

// Картинка (оставил ту же)
const IMAGE_URL = "https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1920&auto=format&fit=crop";

document.getElementById('scareImg').src = IMAGE_URL;

const audio1 = document.getElementById('sound1');
const audio2 = document.getElementById('sound2');
audio1.src = SOUND_1;
audio2.src = SOUND_2;

let done = false;
document.getElementById('btn').addEventListener('click', () => {
  if (done) return;
  done = true;

  // --- ЗАПУСК ЗВУКОВ (максимальная громкость) ---
  audio1.volume = 1.0;
  audio2.volume = 1.0;
  
  audio1.currentTime = 0;
  audio2.currentTime = 0;
  
  // Играем оба одновременно для плотного, громкого эффекта
  audio1.play().catch(()=>{});
  audio2.play().catch(()=>{});

  // --- ВИЗУАЛЬНЫЙ ЭФФЕКТ ---
  const box = document.getElementById('scare');
  box.classList.add('show');
  document.documentElement.requestFullscreen?.().catch(()=>{});

  // Длительность 3 секунды (звуки короче, но визуал держим 3 сек)
  setTimeout(() => {
    box.classList.remove('show');
    audio1.pause();
    audio2.pause();
    audio1.currentTime = 0;
    audio2.currentTime = 0;
    if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  }, 3000);
});
</script>

</body>
</html>
