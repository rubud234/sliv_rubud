<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шутка</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .btn {
            font-size: 24px;
            padding: 15px 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #ff6b81;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="btn" id="startBtn">Посмотреть</button>

    <!-- 关键：这里使用本地文件名，需确保 moan.mp3 已上传到同一目录 -->
    <audio id="moanSound" preload="auto">
        <source src="moan.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('startBtn');
        const sound = document.getElementById('moanSound');

        btn.addEventListener('click', function() {
            // 隐藏按钮
            btn.style.display = 'none';
            
            // 设置音量为最大
            sound.volume = 1.0; 
            
            // 播放声音，并捕获可能的浏览器拦截错误
            sound.play().catch(function(error) {
                console.log("Ошибка воспроизведения:", error);
                // 如果浏览器拦截了自动播放，尝试显示提示或重新触发
                alert("Нажмите ещё раз, чтобы включить звук");
                btn.style.display = 'block'; // 把按钮显示回来让用户再点一次
            });
        });
    </script>

</body>
</html>
