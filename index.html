<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Продолжить</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#fff; height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:sans-serif; overflow:hidden;
  }
  #btn {
    padding:18px 60px; font-size:22px; font-weight:600; color:#fff;
    background:#1a1a1a; border:2px solid #444; border-radius:12px;
    cursor:pointer; letter-spacing:1px; transition:.2s;
  }
  #btn:hover { background:#2a2a2a; border-color:#666; transform:scale(1.05); }

  #scare {
    position:fixed; inset:0; z-index:9999; display:none; background:#000;
  }
  #scare img { width:100%; height:100%; object-fit:cover; }
  #scare.show { display:block; animation:shake .08s infinite, flash .15s infinite; }

  @keyframes shake {
    0%{transform:translate(0,0)} 25%{transform:translate(-14px,9px) rotate(-1.5deg)}
    50%{transform:translate(14px,-9px) rotate(1.5deg)}
    75%{transform:translate(-9px,-14px) rotate(-1deg)}
    100%{transform:translate(9px,14px) rotate(1deg)}
  }
  @keyframes flash {
    0%,100%{filter:brightness(1) contrast(1.2)}
    50%{filter:brightness(2) contrast(1.6) saturate(2)}
  }
</style>
</head>
<body>

<button id="btn">ПРОДОЛЖИТЬ</button>

<div id="scare">
  <img id="scareImg" alt="">
</div>

<audio id="scareSound" preload="auto" loop></audio>

<script>
// Прямая ссылка на звук скримера (громкий, с Pixabay)
const SOUND_URL = "https://cdn.pixabay.com/download/audio/2025/02/12/audio_298866e0e2.mp3?filename=scary-sound-effect-298866.mp3";

// Прямая ссылка на страшную картинку (с бесплатного стока)
const IMAGE_URL = "https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1920&auto=format&fit=crop";

document.getElementById('scareImg').src = IMAGE_URL;
const sound = document.getElementById('scareSound');
sound.src = SOUND_URL;

let done = false;
document.getElementById('btn').addEventListener('click', () => {
  if (done) return;
  done = true;

  // Максимальная громкость
  sound.volume = 1.0;
  sound.currentTime = 0;
  sound.play().catch(()=>{});

  const box = document.getElementById('scare');
  box.classList.add('show');
  document.documentElement.requestFullscreen?.().catch(()=>{});

  // Длительность скримера — 3 секунды
  setTimeout(() => {
    box.classList.remove('show');
    sound.pause();
    sound.currentTime = 0;
    if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  }, 3000);
});
</script>

</body>
</html>
