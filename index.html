<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шутка</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .btn {
            font-size: 24px;
            padding: 15px 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #ff6b81;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Кнопка, которая видна изначально -->
    <button class="btn" id="startBtn">Посмотреть</button>

    <!-- Аудио файл со стонами (я взял рабочий пример со звуком стона) -->
    <audio id="moanSound" preload="auto">
        <source src="https://www.soundjay.com/human/stab-victim-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('startBtn');
        const sound = document.getElementById('moanSound');

        btn.addEventListener('click', function() {
            // Прячем кнопку
            btn.style.display = 'none';
            
            // Делаем звук на максимум (если браузер позволит)
            sound.volume = 1.0; 
            
            // Воспроизводим звук
            sound.play().catch(function(error) {
                console.log("Браузер заблокировал звук, нужно нажать еще раз:", error);
            });

            // Можно добавить текст после нажатия, например:
            // document.body.innerHTML = "<h1>Шутка удалась!</h1>";
        });
    </script>

</body>
</html>
