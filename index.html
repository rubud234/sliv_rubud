<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Взлом...</title>
    <style>
        body {
            background-color: #000;
            color: #0f0; /* Зеленый цвет */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .btn {
            font-size: 22px;
            padding: 15px 40px;
            background-color: #333;
            color: white;
            border: 2px solid #0f0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, sans-serif;
            z-index: 10;
        }
        .btn:active { transform: scale(0.95); }
        
        /* Экран с фото */
        #photoScreen { display: none; flex-direction: column; z-index: 10; }
        #photoScreen img { max-width: 80vw; max-height: 60vh; border: 2px solid #0f0; margin-bottom: 20px; }
        
        /* Экран взлома */
        #hackScreen { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Бегущие цифры на фоне */
        #matrix {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.6;
            z-index: 1;
        }
        
        /* Текст поверх цифр */
        #hackInfo {
            position: relative;
            z-index: 2;
            margin-top: 40vh;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid #0f0;
            display: inline-block;
        }

        #percentText { font-size: 40px; margin: 10px 0; font-weight: bold; }
        #statusText { font-size: 18px; margin-bottom: 20px; }
        #successText { display: none; font-size: 24px; color: #fff; background: #0f0; color: #000; padding: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Экран 1: Кнопка Продолжить -->
    <button class="btn" id="startBtn">Продолжить</button>

    <!-- Экран 2: Фото -->
    <div id="photoScreen">
        <!-- Ссылка на картинку (можно заменить на свою) -->
        <img src="https://picsum.photos/400/300" alt="Фото">
        <button class="btn" id="viewPhotoBtn">Посмотреть фото</button>
    </div>

    <!-- Экран 3: Взлом -->
    <div id="hackScreen">
        <canvas id="matrix"></canvas>
        <div id="hackInfo">
            <div id="statusText">ПЕРЕДАЧА ДАННЫХ...</div>
            <div id="percentText">1%</div>
            <div id="successText">УСПЕШНО!<br>Данные перенесены.</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const photoScreen = document.getElementById('photoScreen');
        const viewPhotoBtn = document.getElementById('viewPhotoBtn');
        const hackScreen = document.getElementById('hackScreen');
        const percentText = document.getElementById('percentText');
        const statusText = document.getElementById('statusText');
        const successText = document.getElementById('successText');
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        // 1. Нажимаем Продолжить
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            photoScreen.style.display = 'flex';
        });

        // 2. Нажимаем Посмотреть фото (Начинается взлом)
        viewPhotoBtn.addEventListener('click', () => {
            photoScreen.style.display = 'none';
            hackScreen.style.display = 'block';
            
            // Включаем звук шуршания
            playNoise();
            
            // Запускаем зеленые цифры
            startMatrix();
            
            // Запускаем прогресс-бар (от 1 до 100 за 10 секунд)
            let progress = 1;
            const interval = setInterval(() => {
                progress++;
                percentText.innerText = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    finishHack();
                }
            }, 100); // 100мс * 100 = 10 секунд
        });

        // Функция создания звука шуршания/помех
        function playNoise() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            
            // Создаем буфер белого шума
            const bufferSize = audioCtx.sampleRate * 10; // 10 секунд
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;
            
            // Фильтр, чтобы звук был глухим (как передача данных по проводам)
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            
            whiteNoise.connect(filter);
            filter.connect(audioCtx.destination);
            whiteNoise.start();
        }

        // Функция бегущих зеленых цифр
        function startMatrix() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const columns = canvas.width / 14; // Ширина символов
            const drops = [];
            for (let x = 0; x < columns; x++) drops[x] = 1;

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = '14px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = String.fromCharCode(0x30A0 + Math.random() * 96); // Японские катаканы (как в Матрице)
                    ctx.fillText(text, i * 14, drops[i] * 14);
                    
                    if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
                if (hackScreen.style.display === 'block') requestAnimationFrame(draw);
            }
            draw();
        }

        // Функция завершения
        function finishHack() {
            statusText.innerText = "СТАТУС: ЗАВЕРШЕНО";
            percentText.style.display = 'none';
            successText.style.display = 'block';
            successText.style.backgroundColor = '#0f0';
            successText.style.color = '#000';
        }
    </script>

</body>
</html>
