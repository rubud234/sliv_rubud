<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Скример</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Кнопка */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px;
            font-size: 28px;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            cursor: pointer;
            z-index: 10;
            border-radius: 8px;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        #start-btn:hover {
            background-color: #555;
            border-color: white;
        }

        /* Слой скримера */
        #scare-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: none;
        }

        /* Картинка скримера */
        #scare-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягивает клоуна на весь экран */
            filter: contrast(1.3) brightness(0.8); /* Оставляет жутковатый вид */
            animation: zoomShake 0.1s infinite; /* Эффект тряски */
        }

        /* Анимация вылета и тряски */
        @keyframes zoomShake {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            20% { transform: scale(1.1) translate(-5px, 5px) rotate(-1deg); }
            40% { transform: scale(1.2) translate(5px, -5px) rotate(1deg); }
            60% { transform: scale(1.1) translate(-5px, -5px) rotate(-1deg); }
            80% { transform: scale(1.2) translate(5px, 5px) rotate(1deg); }
            100% { transform: scale(1.1) translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <button id="start-btn">ПОСМОТРЕТЬ</button>

    <div id="scare-layer">
        <!-- Картинка клоуна вшита в код (Base64), чтобы никогда не сломалась -->
        <img id="scare-img" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QB0RXhpZgAATU0AKgAAAAgABAEOAAIAAAARAAAAPgESAAMAAAABAAEAAAEaAAUAAAABAAAAUAEdAAIAAAAJAAAAWAAAAAAAAABTAGEAbQBzAHUAbgBnACAARwBhAGwAYQB4AHkAIABTADIAMQBVAEcA/+IMWElDQ19QUk9GSUxFAAEBAAAMSGlwcABodHRwOi8vbnMuYWRvYmUuY29tL3hhcC8xLjAvADw/eHBhY2tldCBiZWdpbj0i77u/IiBpZD0iVzVNME1wQ2VoaUh6cmVTek5UY3prYzlkIj8+IDx4OnhtcG1ldGEgeG1sbnM6eD0iYWRvYmU6bnM6bWV0YS8iIHg6eG1wdGs9IlhNUCBDb3JlIDUuNi4mIHRpbWU9IjIwMjMtMDQtMDNUMTQ6Mzc6NDErMDM6MDAiLz4gIDw/eHBhY2tldCBlbmQ9InciPz4A/9sAQwAGBAUGBQQGBgUGBwcGCAoQCgoJCQoUDg8MEBcUGBgXFBYWGh0lHxobIxwWFiAsICMmJykqKRkfLTAtKDAnKCkq/9sAQwEHBwcKCAoTCgoTKBoWGigoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgo/8IAEQgBkAGQAAERAAIRAxEAPwD3+iiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//9k=" alt="Scary Clown">
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const scareLayer = document.getElementById('scare-layer');
        let audioContext;
        let isScared = false;

        function playScarySound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const now = audioContext.currentTime;
            const duration = 30; // Длительность 30 секунд
            
            // 1. Высокий крик
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.type = 'sawtooth'; 
            osc1.frequency.setValueAtTime(1200, now); 
            osc1.frequency.exponentialRampToValueAtTime(400, now + duration); 

            // 2. Низкий рык (бас)
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.type = 'square'; 
            osc2.frequency.setValueAtTime(150, now); 
            osc2.frequency.exponentialRampToValueAtTime(50, now + duration);

            // 3. Шум (хрип, скрежет)
            const bufferSize = audioContext.sampleRate * duration;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;

            // Настройка громкости (плавное затухание к концу 30-й секунды)
            gain1.gain.setValueAtTime(0.6, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            gain2.gain.setValueAtTime(0.8, now);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + duration);

            osc1.connect(gain1);
            gain1.connect(audioContext.destination);
            
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);

            noise.connect(audioContext.destination);

            // Запуск на 30 секунд
            osc1.start(now);
            osc1.stop(now + duration);
            
            osc2.start(now);
            osc2.stop(now + duration);
            
            noise.start(now);
            noise.stop(now + duration);
        }

        startBtn.addEventListener('click', () => {
            if (isScared) return;
            isScared = true;

            // Пытаемся включить полный экран
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Полный экран не включился: ", err);
                });
            }

            playScarySound();

            startBtn.style.display = 'none'; 
            scareLayer.style.display = 'flex'; 
            
            // Ждем 30 секунд (30000 мс), затем скрываем и перезагружаем
            setTimeout(() => {
                scareLayer.style.display = 'none'; 
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                location.reload(); 
            }, 30000); // 30 секунд
        });
    </script>
</body>
</html>
