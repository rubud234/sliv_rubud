<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шутка</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .btn {
            font-size: 24px;
            padding: 15px 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="btn" id="startBtn">Посмотреть</button>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            this.style.display = 'none'; // Прячем кнопку

            // Создаем аудио-контекст (работает без файлов)
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();

            // Создаем осциллятор (генератор звука)
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            // Настраиваем "стонущий" звук (низкая частота с вибрацией)
            osc.type = 'sawtooth'; // Звук более "скрипучий" и жалобный
            osc.frequency.setValueAtTime(100, ctx.currentTime); // Начальная частота
            
            // Делаем эффект "завывания"
            osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 1.5); // Понижаем тон
            osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 3.0); // Повышаем обратно

            // Настройка громкости
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 3.5); // Плавно затихает

            // Подключаем и запускаем
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 3.5); // Длительность звука 3.5 секунды
        });
    </script>

</body>
</html>
