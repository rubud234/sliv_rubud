<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сюрприз!</title>
    <style>
        body {
            background-color: #121212; /* Темный фон */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Стили для кнопки */
        .prank-button {
            font-size: 40px; /* Очень большая надпись */
            font-weight: bold;
            padding: 20px 50px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s, background-color 0.3s;
            text-transform: uppercase;
        }

        .prank-button:active {
            transform: scale(0.95); /* Эффект нажатия */
        }

        /* Класс, который применится после клика */
        .clicked {
            background-color: #2ed573;
            font-size: 30px; /* Уменьшаем размер, чтобы влезло */
        }
    </style>
</head>
<body>

    <h2 style="font-size: 24px; text-align: center; margin-bottom: 20px;">Хочешь увидеть кое-что смешное?</h2>
    
    <!-- Сама кнопка -->
    <button id="prankBtn" class="prank-button">Посмотреть</button>

    <!-- Скрытое аудио со смехом -->
    <audio id="laughSound">
        <!-- Ссылка на звук смеха из свободной библиотеки -->
        <source src="https://www.myinstants.com/media/sounds/laugh.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <script>
        const btn = document.getElementById('prankBtn');
        const audio = document.getElementById('laughSound');

        btn.addEventListener('click', () => {
            // 1. Меняем текст и цвет кнопки
            btn.textContent = 'Нажми сюда';
            btn.classList.add('clicked');
            
            // 2. Делаем звук максимально громким (1.0 - это максимум)
            audio.volume = 1.0;
            
            // 3. Воспроизводим звук
            audio.play();

            // 4. Делаем так, чтобы при повторном нажатии звук начинался заново
            btn.onclick = function() {
                audio.currentTime = 0; 
                audio.play();
            };
        });
    </script>

</body>
</html>
