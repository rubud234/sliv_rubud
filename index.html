<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шутка</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .btn {
            font-size: 24px;
            padding: 15px 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="btn" id="startBtn">Посмотреть</button>

    <!-- Ссылка на надежный архивный файл со стоном -->
    <audio id="moanSound" preload="auto">
        <source src="https://ia800204.us.archive.org/26/items/StoN/StoN.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('startBtn');
        const sound = document.getElementById('moanSound');

        btn.addEventListener('click', function() {
            btn.style.display = 'none'; 
            sound.volume = 1.0; 
            
            // Попытка воспроизвести звук
            let playPromise = sound.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Звук пошел
                }).catch(error => {
                    // Если браузер заблокировал
                    alert("Браузер заблокировал звук. Нажмите ОК и попробуйте нажать кнопку еще раз!");
                    btn.style.display = 'block'; // Возвращаем кнопку
                });
            }
        });
    </script>

</body>
</html>
