<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скример</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Кнопка запуска (нужна для разрешения звука) */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background-color: darkred;
            color: white;
            border: 2px solid red;
            cursor: pointer;
            z-index: 10;
            border-radius: 10px;
            box-shadow: 0 0 20px red;
        }

        #start-btn:hover {
            background-color: red;
        }

        /* Слой для картинки скримера */
        #scare-layer {
            display: none; /* Скрыт по умолчанию */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: none;
        }

        #scare-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягивает картинку на весь экран */
            filter: contrast(1.2) brightness(0.9); /* Немного затемняем для страха */
            animation: shake 0.1s infinite; /* Тряска */
        }

        /* Анимация тряски */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <!-- Кнопка старта -->
    <button id="start-btn">НАЖМИ МЕНЯ (Страшно)</button>

    <!-- Слой скримера -->
    <div id="scare-layer">
        <!-- Вставьте сюда вашу картинку. Пока стоит заглушка, но вы можете заменить ссылку -->
        <img id="scare-img" src="https://i.ibb.co/6P4y6yF/clown.jpg" alt="Scary Clown">
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const scareLayer = document.getElementById('scare-layer');
        let audioContext;
        let isScared = false;

        // Функция для создания страшного звука (Web Audio API)
        // Это надежнее, чем искать mp3 файл, и звук точно будет.
        function playScarySound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const now = audioContext.currentTime;
            
            // 1. Низкий гул (Бас)
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.type = 'sawtooth'; // Злой звук
            osc1.frequency.setValueAtTime(50, now); // Низкая частота
            osc1.frequency.exponentialRampToValueAtTime(10, now + 2); // Падение вниз

            // 2. Высокий скрежет (Крик)
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.type = 'square'; // Резкий звук
            osc2.frequency.setValueAtTime(800, now); 
            osc2.frequency.exponentialRampToValueAtTime(2000, now + 0.5); // Взлет вверх

            // Шум (для эффекта "хрипа")
            const bufferSize = audioContext.sampleRate * 2;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;

            // Громкость
            gain1.gain.setValueAtTime(0.5, now); // Громкость баса
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 2);
            
            gain2.gain.setValueAtTime(0.2, now); // Громкость скрежета
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 1.5);

            // Подключение
            osc1.connect(gain1);
            gain1.connect(audioContext.destination);
            
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);

            noise.connect(audioContext.destination);

            // Запуск
            osc1.start(now);
            osc1.stop(now + 2);
            
            osc2.start(now);
            osc2.stop(now + 1.5);
            
            noise.start(now);
            noise.stop(now + 2);
        }

        // Обработчик клика
        startBtn.addEventListener('click', () => {
            if (isScared) return;
            isScared = true;

            // 1. Включаем полноэкранный режим (без лишних подсказок)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // 2. Воспроизводим звук (сразу после клика, браузер разрешит)
            playScarySound();

            // 3. Показываем картинку
            startBtn.style.display = 'none'; // Скрываем кнопку
            scareLayer.style.display = 'flex'; // Показываем скример
            
            // 4. Через 3 секунды возвращаем всё обратно (или перезагружаем)
            setTimeout(() => {
                scareLayer.style.display = 'none'; // Скрываем скример
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                // Перезагрузка страницы, чтобы можно было испугаться снова
                location.reload(); 
            }, 3000); // 3000 мс = 3 секунды
        });
    </script>
</body>
</html>
